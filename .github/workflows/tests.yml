name: Tests

on:
  schedule:
    - cron: "0 8 * * 1-5"
  pull_request:
  workflow_dispatch:

concurrency:
  group: actions-id-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      # clone the repo, run black and flake8 on it
      - uses: actions/checkout@v6
      - run: python -m pip install black==23.* flake8 isort
      - run: black --check .
      - run: isort --check .

  build-and-test:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }} Subtest
    runs-on: ${{ matrix.os }}
    needs: lint
    # run in conda env
    defaults:
      run:
        shell: bash -el {0}
    strategy: 
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
        - uses: actions/checkout@v6
        # Pinned to a release tag instead of @main so the micromamba binary does
        # not move under us. Uses conda-forge only: the 'defaults' channel let
        # anaconda.com publish a tk 9.0.4 win-64 build (pulled in by python 3.14.7)
        # that crashed micromamba on Windows with exit code 0xC0000005.
        - uses: mamba-org/setup-micromamba@v3.2.1
          with:
            environment-name: temp
            condarc: |
              channels:
                - conda-forge
              channel_priority: flexible
            create-args: |
              python=${{ matrix.python-version }}
        - name: Install
          run: |
            pip install coveralls dataclasses
            pip install .[test]
        - name: Tests
          run: |
            pytest --cov --pyargs chemplot
        - name: Upload coverage data to coveralls.io
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            COVERALLS_PARALLEL: true
          run: coveralls --service=github
